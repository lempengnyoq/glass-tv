
name: Build Glass TV APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
          packages: |
            platform-tools
            platforms;android-34
            build-tools;34.0.0

      - name: Build Glass TV
        working-directory: launcher
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleDebug

      - name: Check APK
        run: |
          echo "Checking generated APK..."
          find launcher/app/build/outputs/apk -type f -name "*.apk" -print
          test -n "$(find launcher/app/build/outputs/apk -type f -name '*.apk' -print -quit)"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Glass-TV-APK
          path: launcher/app/build/outputs/apk/
          if-no-files-found: error
          
